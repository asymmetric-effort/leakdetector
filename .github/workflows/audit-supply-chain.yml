name: Audit Supply Chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: asymmetric-effort/actions/actions/audit-supply-chain@main
        with:
          create-issues: "true"
